<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b14"><title>STALLZ AI — One AI. Endless possibilities.</title>
<style>
:root{color-scheme:dark;--bg:#080b14;--panel:#101727;--panel2:#141e31;--line:#27334a;--text:#f4f7ff;--muted:#a3aec3;--cyan:#48dcff;--blue:#6c8dff;--pink:#d58aff;--good:#62e6b2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -15%,#182b50 0,transparent 45%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100dvh}.sidebar{border-right:1px solid var(--line);background:#0a0f1b;padding:20px 14px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:10px;padding:5px 7px}.mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#06101b;display:grid;place-items:center;font-weight:950;box-shadow:0 0 30px #48dcff25}.brand strong{font-size:18px;letter-spacing:.5px}.brand small{display:block;color:var(--muted);font-size:11px}.primary,.btn{border:0;border-radius:12px;padding:11px 14px;background:linear-gradient(100deg,var(--cyan),#9ba8ff);color:#07111d;font-weight:800}.nav{display:grid;gap:7px}.nav button,.history-item{display:flex;gap:11px;align-items:center;text-align:left;padding:11px 12px;background:transparent;border:1px solid transparent;border-radius:11px;color:var(--muted)}.nav button.active,.nav button:hover,.history-item:hover{background:var(--panel2);border-color:var(--line);color:var(--text)}.nav .ico{width:22px;text-align:center;color:var(--cyan);font-size:17px}.section-label{font-size:10px;letter-spacing:1.7px;color:#77849d;padding:0 10px}.history{display:grid;gap:5px;overflow:auto;max-height:35vh}.history-item{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.side-bottom{margin-top:auto;border:1px solid var(--line);background:var(--panel);padding:13px;border-radius:14px}.side-bottom p{color:var(--muted);font-size:12px;margin:6px 0 10px}.main{min-width:0;display:flex;flex-direction:column}.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid #27334a99;position:sticky;top:0;background:#080b14e8;backdrop-filter:blur(16px);z-index:3}.topbar .right{display:flex;gap:8px;align-items:center}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:12px;color:var(--muted)}.content{width:min(100%,1050px);margin:0 auto;padding:34px 26px 48px;flex:1}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);font-weight:800}.hero{padding:20px 0 28px}.hero h1{font-size:clamp(34px,6vw,58px);letter-spacing:-2px;line-height:1.04;margin:12px 0 16px}.gradient{background:linear-gradient(90deg,#fff,var(--cyan),#a9aaff);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:var(--muted);max-width:580px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.feature{position:relative;text-align:left;min-height:142px;border:1px solid var(--line);border-radius:17px;padding:18px;background:linear-gradient(145deg,#141e30,#0d1321);color:var(--text);transition:transform .18s,border-color .18s}.feature:hover{transform:translateY(-2px);border-color:#48dcff80}.feature .symbol{font-size:23px;color:var(--cyan);margin-bottom:14px}.feature strong{display:block;font-size:16px}.feature p{color:var(--muted);font-size:12px;margin:5px 0 0}.feature .arrow{position:absolute;right:17px;top:18px;color:#7e8aa4}.panel{border:1px solid var(--line);border-radius:18px;background:#0d1422;padding:20px;margin-top:20px}.panel h2{margin:0 0 6px;font-size:19px}.muted{color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.smallbtn{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#131d2e;color:var(--text)}.smallbtn:hover{border-color:var(--cyan)}.field{width:100%;background:#080e19;border:1px solid #2a3850;border-radius:12px;padding:13px;color:var(--text);resize:vertical}.field::placeholder{color:#66748c}.compose{display:flex;gap:9px;align-items:flex-end;margin-top:12px}.compose .field{min-height:48px;max-height:170px}.chatlog{display:grid;gap:13px;max-height:48vh;overflow:auto;margin:16px 0}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);background:#111a2a;border-radius:14px;padding:13px 15px;max-width:90%}.bubble.user{justify-self:end;background:#12263a;border-color:#24607a}.bubble .who{font-size:10px;letter-spacing:1px;color:var(--cyan);margin-bottom:5px}.status{font-size:12px;color:var(--muted);min-height:18px;margin-top:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.preview{min-height:100px;border:1px dashed #35445f;border-radius:12px;padding:14px;color:var(--muted);overflow-wrap:anywhere}.output-image{max-width:100%;border-radius:12px;margin-top:12px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#19283c;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:9;box-shadow:0 10px 35px #0008}.footer{color:#71809a;text-align:center;font-size:11px;padding:22px}.danger{color:#ffb2b2}.tag{font-size:11px;padding:4px 8px;border:1px solid var(--line);border-radius:7px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:5;border-right:0;border-bottom:1px solid var(--line);padding:9px 10px;gap:8px}.brand{padding:2px 5px}.mark{width:32px;height:32px}.brand strong{font-size:16px}.brand small{display:none}.nav{display:flex;overflow:auto;gap:4px}.nav button{flex:0 0 auto;padding:8px 10px;font-size:12px}.nav .ico{width:auto}.section-label,.history,.side-bottom{display:none}.topbar{height:49px;padding:0 14px}.content{padding:23px 15px 34px}.hero h1{letter-spacing:-1px}.grid{gap:9px}.feature{padding:14px;min-height:135px}.feature p{font-size:11px}.panel{padding:15px}.two{grid-template-columns:1fr}.pill{font-size:10px}.compose{align-items:stretch}.compose .btn{padding:10px}}
@media(max-width:370px){.grid{grid-template-columns:1fr}.nav button{font-size:11px;padding:8px}.compose{flex-direction:column}.compose .btn{width:100%}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
 <div class="brand"><div class="mark">S</div><div><strong>STALLZ <span class="gradient">AI</span></strong><small>One AI. Endless possibilities.</small></div></div>
 <button class="primary" id="newChat">＋ New conversation</button>
 <div class="section-label">WORKSPACE</div>
 <nav class="nav" id="nav">
  <button class="active" data-page="home"><span class="ico">⌂</span>Home</button>
  <button data-page="chat"><span class="ico">✧</span>AI Chat</button>
  <button data-page="image"><span class="ico">▧</span>Image studio</button>
  <button data-page="video"><span class="ico">▶</span>Video studio</button>
  <button data-page="voice"><span class="ico">♫</span>Voice</button>
  <button data-page="settings"><span class="ico">⚙</span>Settings</button>
 </nav>
 <div class="section-label">RECENT CHATS</div><div class="history" id="history"></div>
 <div class="side-bottom"><span class="tag">YOUR WORKSPACE</span><p>Connect an AI provider in Settings to enable real AI responses.</p><button class="smallbtn" data-goto="settings">Configure AI →</button></div>
</aside>
<main class="main">
 <div class="topbar"><span id="topTitle">Workspace overview</span><div class="right"><span class="pill">● Private on this device</span><span class="pill">Preview</span></div></div>
 <div class="content" id="content"></div><div class="footer">STALLZ AI · Independent project · Provider features require configuration</div>
</main></div><div id="toast" class="toast hidden" role="status"></div>
<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const KEY='stallz_ai_v1', CFG='stallz_ai_config_v1';
let state={page:'home',chats:[],active:null};
try{const old=JSON.parse(localStorage.getItem(KEY)||'{}');state.chats=Array.isArray(old.chats)?old.chats:[];state.active=old.active||null}catch(e){}
let config={endpoint:'',apiKey:'',model:''};try{config=Object.assign(config,JSON.parse(localStorage.getItem(CFG)||'{}'))}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify({chats:state.chats,active:state.active}))}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2600)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function current(){return state.chats.find(c=>c.id===state.active)}
function newChat(){const c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:'New conversation',messages:[],updated:Date.now()};state.chats.unshift(c);state.active=c.id;save();render('chat')}
function addMessage(role,text){let c=current();if(!c){newChat();c=current()}c.messages.push({role,text,at:Date.now()});if(c.title==='New conversation'&&role==='user')c.title=text.slice(0,42);c.updated=Date.now();state.chats.sort((a,b)=>b.updated-a.updated);save();renderHistory()}
function renderHistory(){$('#history').innerHTML=state.chats.slice(0,12).map(c=>`<button class="history-item" data-chat="${c.id}">◦ ${esc(c.title||'Conversation')}</button>`).join('')||'<span class="muted" style="font-size:12px;padding:0 10px">No conversations yet</span>';$$('[data-chat]').forEach(b=>b.onclick=()=>{state.active=b.dataset.chat;save();render('chat')})}
function setPage(p){state.page=p;render(p)}
function renderHome(){return `<section class="hero"><div class="eyebrow">A smarter creative workspace</div><h1>One AI.<br><span class="gradient">Endless possibilities.</span></h1><p>Chat, plan, create prompts, and explore voice tools from one clean workspace. Connect a compatible AI provider to enable live answers.</p><div class="toolbar"><button class="primary" data-goto="chat">Start chatting ↗</button><button class="smallbtn" data-goto="settings">Connect AI provider</button></div></section><div class="grid"><button class="feature" data-goto="chat"><div class="symbol">✧</div><strong>AI Chat</strong><p>Ask, brainstorm, write, summarize, and learn.</p><span class="arrow">↗</span></button><button class="feature" data-goto="image"><div class="symbol">▧</div><strong>Image studio</strong><p>Build polished image prompts and open a connected generator.</p><span class="arrow">↗</span></button><button class="feature" data-goto="video"><div class="symbol">▶</div><strong>Video studio</strong><p>Shape scenes, motion, camera, and style prompts.</p><span class="arrow">↗</span></button><button class="feature" data-goto="voice"><div class="symbol">♫</div><strong>Voice assistant</strong><p>Use available speech recognition and spoken playback.</p><span class="arrow">↗</span></button></div><section class="panel"><div class="row"><div><h2>Your AI workspace</h2><p class="muted">Conversations are saved locally in this browser.</p></div><span class="tag">LOCAL HISTORY</span></div><p class="muted">No AI can honestly be guaranteed to be “better than every AI in the world.” STALLZ AI is designed to be extensible; its answers and creative tools depend on the provider you connect.</p></section>`}
function renderChat(){const c=current();const msgs=c?c.messages:[];return `<div class="row"><div><div class="eyebrow">Conversation</div><h2 style="margin:5px 0">AI Chat</h2><p class="muted" style="margin:0">Your connected provider powers responses.</p></div><button class="smallbtn" id="clearChat">Clear chat</button></div><div class="chatlog" id="chatlog">${msgs.map(m=>`<div class="bubble ${m.role==='user'?'user':''}"><div class="who">${m.role==='user'?'YOU':'STALLZ AI'}</div>${esc(m.text)}</div>`).join('')||'<div class="preview">Try: “Help me plan a project”, “Explain a hard topic simply”, or “Draft a professional email.”</div>'}</div><div class="compose"><textarea class="field" id="chatInput" rows="1" placeholder="Message STALLZ AI…"></textarea><button class="btn" id="send">Send ↑</button></div><div class="status" id="chatStatus"></div><p class="muted" style="font-size:11px">Do not enter passwords or sensitive personal information. Provider requests may be sent to the endpoint you configure.</p>`}
function renderImage(){return `<div class="eyebrow">Creative tools</div><h2>Image studio</h2><p class="muted">Create a detailed prompt. Actual image generation requires a connected image provider.</p><section class="panel"><label for="imgSubject">What should the image show?</label><textarea id="imgSubject" class="field" rows="3" placeholder="A futuristic city at night, cinematic lighting…"></textarea><div class="two" style="margin-top:12px"><div><label>Visual style</label><select class="field" id="imgStyle"><option>Cinematic</option><option>Photorealistic</option><option>3D render</option><option>Anime</option><option>Minimalist</option><option>Watercolor</option><option>Product photography</option></select></div><div><label>Aspect ratio</label><select class="field" id="imgRatio"><option>16:9 landscape</option><option>1:1 square</option><option>9:16 portrait</option><option>4:3</option></select></div></div><div class="toolbar"><button class="primary" id="makeImgPrompt">Build prompt</button><button class="smallbtn" id="copyImg">Copy prompt</button></div><div class="preview" id="imgOut">Your refined image prompt will appear here.</div></section>`}
function renderVideo(){return `<div class="eyebrow">Creative tools</div><h2>Video studio</h2><p class="muted">Prepare a cinematic video prompt. Video rendering requires a connected video-generation service.</p><section class="panel"><label for="vidSubject">Describe your scene</label><textarea id="vidSubject" class="field" rows="3" placeholder="A sleek futuristic train glides through a glowing city…"></textarea><div class="two" style="margin-top:12px"><div><label>Duration</label><select id="vidDuration" class="field"><option>8 seconds</option><option>5 seconds</option><option>10 seconds</option><option>15 seconds</option></select></div><div><label>Camera movement</label><select id="vidCamera" class="field"><option>Slow cinematic zoom-out</option><option>Tracking shot</option><option>Slow push-in</option><option>Orbiting camera</option><option>Drone aerial reveal</option></select></div></div><div class="toolbar"><button class="primary" id="makeVidPrompt">Build video prompt</button><button class="smallbtn" id="copyVid">Copy prompt</button></div><div class="preview" id="vidOut">Your video prompt will appear here.</div></section>`}
function renderVoice(){return `<div class="eyebrow">Hands-free tools</div><h2>Voice assistant</h2><p class="muted">Speech support varies by browser and device. This uses built-in browser speech APIs where available; it is not a live voice AI connection.</p><section class="panel"><div class="row"><span class="tag" id="voiceState">READY</span><button class="smallbtn" id="speakStop">Stop speaking</button></div><textarea class="field" id="voiceText" rows="4" placeholder="Tap Start listening and speak, or type text to read aloud…"></textarea><div class="toolbar"><button class="primary" id="listen">🎙 Start listening</button><button class="smallbtn" id="speak">🔊 Read aloud</button></div><div class="status" id="voiceStatus"></div></section>`}
function renderSettings(){return `<div class="eyebrow">Configuration</div><h2>Connect an AI provider</h2><p class="muted">Use a compatible OpenAI-style chat-completions endpoint. You need your own provider account and API key. Never publish a key in a public repository.</p><section class="panel"><label for="endpoint">API endpoint</label><input class="field" id="endpoint" placeholder="https://your-provider.example/v1/chat/completions" value="${esc(config.endpoint)}"><label for="model" style="display:block;margin-top:12px">Model name</label><input class="field" id="model" placeholder="Your provider's model ID" value="${esc(config.model)}"><label for="apiKey" style="display:block;margin-top:12px">API key (optional until connecting)</label><input class="field" id="apiKey" type="password" autocomplete="off" placeholder="Enter key only on a trusted personal device"><div class="toolbar"><button class="primary" id="saveConfig">Save settings</button><button class="smallbtn" id="testConfig">Test connection</button><button class="smallbtn" id="forgetConfig">Forget saved key/settings</button></div><p class="danger" style="font-size:12px">Security note: this simple three-file app stores settings in this browser's local storage. It is not suitable for storing a sensitive production API key, and frontend requests expose the key to the local browser. A secure server-side backend is recommended for a public app.</p><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Data & privacy</h3><p class="muted">Chat history is stored in this browser on this device. It is not synced between devices and can be erased by clearing browser data.</p><button class="smallbtn" id="eraseHistory">Delete all local chat history</button></section>`}
function render(page){page=page||state.page;state.page=page;const titles={home:'Workspace overview',chat:'AI Chat',image:'Image studio',video:'Video studio',voice:'Voice assistant',settings:'Settings'};$('#topTitle').textContent=titles[page]||titles.home;$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#content').innerHTML=({home:renderHome,chat:renderChat,image:renderImage,video:renderVideo,voice:renderVoice,settings:renderSettings}[page]||renderHome)();renderHistory();bindPage()}
function bindPage(){
$$('[data-goto]').forEach(b=>b.onclick=()=>setPage(b.dataset.goto));
if($('#send')){$('#send').onclick=sendChat;$('#chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}});$('#clearChat').onclick=()=>{if(current()){current().messages=[];current().title='New conversation';save();render('chat')}}}
if($('#makeImgPrompt')){$('#makeImgPrompt').onclick=()=>{const s=$('#imgSubject').value.trim();$('#imgOut').textContent=s?`${s}. Style: ${$('#imgStyle').value}. Composition: clear focal subject, refined lighting, high detail. Aspect ratio: ${$('#imgRatio').value}.`: 'Describe an image first.'};$('#copyImg').onclick=()=>copyText($('#imgOut').textContent)}
if($('#makeVidPrompt')){$('#makeVidPrompt').onclick=()=>{const s=$('#vidSubject').value.trim();$('#vidOut').textContent=s?`${$('#vidDuration').value} cinematic video. Scene: ${s}. Camera: ${$('#vidCamera').value}. Smooth continuous motion, deliberate composition, consistent subjects and lighting, polished professional finish. No unwanted text or logos.`:'Describe a video scene first.'};$('#copyVid').onclick=()=>copyText($('#vidOut').textContent)}
if($('#saveConfig'))$('#saveConfig').onclick=()=>{config.endpoint=$('#endpoint').value.trim();config.model=$('#model').value.trim();config.apiKey=$('#apiKey').value.trim()||config.apiKey;localStorage.setItem(CFG,JSON.stringify(config));toast('Settings saved on this device.')};
if($('#testConfig'))$('#testConfig').onclick=async()=>{readConfigFields();const s=$('#voiceStatus')||null;toast('Testing provider…');try{const r=await callProvider([{role:'user',content:'Reply with the word connected.'}]);toast('Provider replied: '+String(r).slice(0,80))}catch(e){toast('Connection failed: '+e.message.slice(0,100))}};
if($('#forgetConfig'))$('#forgetConfig').onclick=()=>{config={endpoint:'',apiKey:'',model:''};localStorage.removeItem(CFG);render('settings');toast('Saved settings forgotten.')};
if($('#eraseHistory'))$('#eraseHistory').onclick=()=>{state.chats=[];state.active=null;save();render('settings');toast('Local history deleted.')};
if($('#listen'))startListening();
if($('#speak'))$('#speak').onclick=()=>speakText($('#voiceText').value);
if($('#speakStop'))$('#speakStop').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel()};
}
function readConfigFields(){if($('#endpoint'))config.endpoint=$('#endpoint').value.trim();if($('#model'))config.model=$('#model').value.trim();if($('#apiKey')&&$('#apiKey').value.trim())config.apiKey=$('#apiKey').value.trim();localStorage.setItem(CFG,JSON.stringify(config))}
async function callProvider(messages){readConfigFields();if(!config.endpoint||!config.apiKey||!config.model)throw new Error('Add endpoint, model, and API key in Settings first.');const response=await fetch(config.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+config.apiKey},body:JSON.stringify({model:config.model,messages,temperature:.7})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error?.message||'HTTP '+response.status+' — check endpoint, key, model, and provider CORS support.');const text=data.choices?.[0]?.message?.content;if(!text)throw new Error('Provider response format was not recognized.');return typeof text==='string'?text:JSON.stringify(text)}
async function sendChat(){const input=$('#chatInput');const text=input.value.trim();if(!text)return;input.value='';if(!current())newChat();addMessage('user',text);render('chat');const status=$('#chatStatus');status.textContent='Connecting to your configured AI provider…';try{const c=current();const answer=await callProvider(c.messages.map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.text})));addMessage('assistant',answer);render('chat')}catch(e){status=$('#chatStatus');if(status)status.textContent='Not connected: '+e.message;toast('AI reply unavailable. Check Settings.')} }
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied to clipboard.')}catch(e){toast('Select and copy the prompt manually.')}} 
function startListening(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceStatus').textContent='Speech recognition is not supported in this browser. Try a compatible browser.';return}const rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.onstart=()=>{$('#voiceState').textContent='LISTENING';$('#voiceStatus').textContent='Listening…'};rec.onresult=e=>{$('#voiceText').value+=(($('#voiceText').value?' ':'')+e.results[0][0].transcript);$('#voiceStatus').textContent='Speech captured.'};rec.onerror=e=>$('#voiceStatus').textContent='Speech error: '+e.error;rec.onend=()=>$('#voiceState').textContent='READY';rec.start()}
function speakText(t){if(!('speechSynthesis'in window)){toast('Speech playback is not supported in this browser.');return}speechSynthesis.cancel();if(t.trim()){const u=new SpeechSynthesisUtterance(t);speechSynthesis.speak(u)}}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});$('#newChat').onclick=newChat;render('home');
})();
</script>
</body></html>
